server {
    listen 8080;
    root /usr/share/nginx/html;
    server_tokens off;

    location /api/ {
        proxy_pass http://api:8000/;
        proxy_http_version 1.1;
        proxy_read_timeout 750s;
        client_max_body_size 0;
        proxy_request_buffering off;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
