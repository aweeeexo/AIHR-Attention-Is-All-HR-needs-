<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AIHR · подбор вакансии по доказательствам</title>
    <meta name="description" content="AIHR сверяет резюме с каждым требованием вакансии, приводит цитату из документа и ставит один из четырёх статусов. Рейтинг вакансий, вопросы кандидату и отчёт в DOCX." />
    <meta name="robots" content="noindex, nofollow" />
    <meta property="og:title" content="AIHR · подбор вакансии по доказательствам" />
    <meta property="og:description" content="Сопоставление резюме с вакансиями: цитата к каждому выводу, балл по одной формуле, вопросы кандидату." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/og.svg" />
    <meta name="theme-color" content="#181818" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      // Тема до первой отрисовки: тёмная, если пользователь не выбрал светлую
      (function () {
        var theme = null;
        try { theme = localStorage.getItem('aihr-theme'); } catch (e) {}
        if (theme !== 'light') theme = 'dark';
        document.documentElement.dataset.theme = theme;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
