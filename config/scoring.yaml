# Веса и пороги балла. Одинаковы для всех вакансий (критерий 3, D11). Подробности — T08.
# S = 100 · Σ w·v / Σ w;  v: соответствует 1, частично p, не соответствует 0, не указано u
weights:
  must: 3
  nice: 1          # обязанности (duty) идут как nice — D3
  soft: 1          # личные качества, даже обязательные, и на метку не влияют — D55
partial_default: 0.5   # p, если у требования нет числового порога
unknown_value: 0.5     # u, нейтрально — D5. Интервал считается при u = 0 и u = 1
labels:
  fits:              { min_score: 70, max_blocking_gaps: 0 }
  # и подтверждена доля обязательных не ниже min_confirmed, либо нижняя граница интервала ≥ min_score (D41)
  fits_with_caveats: { min_score: 45, min_confirmed: 0.5 }
  # остальное — not_fit
# Разница баллов меньше этой — «почти вровень»: порядок не надёжен, объяснение об этом говорит (D40)
close_margin: 3
